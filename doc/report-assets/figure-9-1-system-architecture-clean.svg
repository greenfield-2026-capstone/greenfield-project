<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .caption { font: 500 18px Arial, sans-serif; fill: #4b5563; }
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 10; }
      .boxLight { fill: #f9fafb; stroke: #374151; stroke-width: 1.8; rx: 10; }
      .main { fill: #111827; stroke: #111827; stroke-width: 2; rx: 10; }
      .mainText { font: 700 22px Arial, sans-serif; fill: #ffffff; }
      .label { font: 700 22px Arial, sans-serif; fill: #111827; }
      .small { font: 500 16px Arial, sans-serif; fill: #374151; }
      .tiny { font: 500 14px Arial, sans-serif; fill: #6b7280; }
      .arrow { stroke: #111827; stroke-width: 2.4; fill: none; marker-end: url(#arrowhead); }
      .arrowLight { stroke: #6b7280; stroke-width: 2; fill: none; marker-end: url(#arrowheadLight); }
      .divider { stroke: #d1d5db; stroke-width: 1.4; stroke-dasharray: 6 6; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#111827"/>
    </marker>
    <marker id="arrowheadLight" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#6b7280"/>
    </marker>
  </defs>

  <rect class="bg" width="1400" height="820"/>

  <text x="70" y="70" class="title">Histour System Architecture</text>
  <text x="70" y="103" class="caption">관광지 탐색, AI 역사 인물 대화, 선택형 결말, 영상 콘텐츠 제공 흐름</text>

  <rect x="70" y="165" width="210" height="100" class="main"/>
  <text x="175" y="205" text-anchor="middle" class="mainText">User</text>
  <text x="175" y="235" text-anchor="middle" class="mainText">Web Browser</text>

  <rect x="390" y="135" width="315" height="160" class="box"/>
  <text x="548" y="180" text-anchor="middle" class="label">Frontend</text>
  <text x="548" y="212" text-anchor="middle" class="small">Next.js App Router</text>
  <text x="548" y="240" text-anchor="middle" class="small">장소 탐색 / 상세 페이지</text>
  <text x="548" y="268" text-anchor="middle" class="small">스토리 대화 / 엔딩 화면</text>

  <rect x="820" y="135" width="240" height="140" class="boxLight"/>
  <text x="940" y="178" text-anchor="middle" class="label">Data Layer</text>
  <text x="940" y="210" text-anchor="middle" class="small">curated places.json</text>
  <text x="940" y="238" text-anchor="middle" class="small">관광지 데이터 API</text>

  <rect x="820" y="330" width="240" height="150" class="boxLight"/>
  <text x="940" y="374" text-anchor="middle" class="label">AI Layer</text>
  <text x="940" y="406" text-anchor="middle" class="small">AI Chat API</text>
  <text x="940" y="434" text-anchor="middle" class="small">OpenAI API</text>
  <text x="940" y="462" text-anchor="middle" class="small">응답 / 선택지 생성</text>

  <rect x="820" y="535" width="240" height="150" class="boxLight"/>
  <text x="940" y="579" text-anchor="middle" class="label">Content Layer</text>
  <text x="940" y="611" text-anchor="middle" class="small">장소 / 인물 이미지</text>
  <text x="940" y="639" text-anchor="middle" class="small">Runway 엔딩 영상</text>

  <rect x="1160" y="330" width="190" height="150" class="boxLight"/>
  <text x="1255" y="374" text-anchor="middle" class="label">Supabase</text>
  <text x="1255" y="406" text-anchor="middle" class="small">사용자 정보</text>
  <text x="1255" y="434" text-anchor="middle" class="small">엔딩 기록 저장</text>

  <path d="M280 215 H390" class="arrow"/>
  <path d="M705 205 H820" class="arrow"/>
  <path d="M705 245 C765 245 760 405 820 405" class="arrow"/>
  <path d="M705 268 C765 268 760 610 820 610" class="arrow"/>
  <path d="M1060 405 H1160" class="arrowLight"/>

  <line x1="750" y1="120" x2="750" y2="705" class="divider"/>
  <text x="548" y="365" text-anchor="middle" class="tiny">스토리 진행 상태와 선택 점수 관리</text>
  <text x="548" y="392" text-anchor="middle" class="tiny">검색, 필터, 화면 전환, 엔딩 분기 처리</text>

  <text x="940" y="315" text-anchor="middle" class="tiny">장소 및 인물 정보 제공</text>
  <text x="940" y="520" text-anchor="middle" class="tiny">역사 인물 대화 생성</text>
  <text x="940" y="725" text-anchor="middle" class="tiny">선택 결과에 맞는 영상 제공</text>
</svg>
